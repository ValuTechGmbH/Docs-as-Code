<!-- overrides/pdf/cover.html
     Custom PDF cover page for mkdocs-with-pdf.
     The logo, title, and subtitle are rendered here. -->

<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Helvetica Neue", Arial, sans-serif;
      color: #333;
    }
    .cover-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 40px;
      box-sizing: border-box;
    }
    .cover-logo {
      max-width: 280px;
      max-height: 120px;
      margin-bottom: 60px;
    }
    .cover-title {
      font-size: 36px;
      font-weight: 700;
      color: #1a237e;
      margin-bottom: 16px;
    }
    .cover-subtitle {
      font-size: 20px;
      font-weight: 400;
      color: #555;
      margin-bottom: 40px;
    }
    .cover-meta {
      font-size: 14px;
      color: #888;
      margin-top: auto;
      padding-bottom: 40px;
    }
    .cover-line {
      width: 80px;
      height: 4px;
      background: #3f51b5;
      margin: 30px auto;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div class="cover-page">

    <img class="cover-logo" src="{{ cover_logo }}" alt="ValuTech Logo">

    {% if cover_title %}
    <div class="cover-title">{{ cover_title }}</div>
    {% endif %}

    {% if cover_subtitle %}
    <div class="cover-subtitle">{{ cover_subtitle }}</div>
    {% endif %}

    <div class="cover-meta">
      {{ author }}<br>
      {{ copyright }}
    </div>

  </div>
</body>
</html>
