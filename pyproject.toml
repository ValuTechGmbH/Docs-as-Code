[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "valutech-docs-template"
version = "0.1.0"
description = "ValuTech MkDocs documentation template with Material theme and PDF export"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "ValuTech GmbH" },
]
dependencies = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-with-pdf>=0.9",
]

[project.optional-dependencies]
dev = [
    "build",
]

[tool.setuptools.packages.find]
include = ["valutech_docs_template*"]

[tool.setuptools.package-data]
"valutech_docs_template" = [
    "mkdocs.yml",
    "docs/**/*",
    "overrides/**/*",
]
