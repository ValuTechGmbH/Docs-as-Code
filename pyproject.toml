[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "valutech-docs-template"
version = "0.2.0"
description = "ValuTech MkDocs documentation template with Material theme and PDF export"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "ValuTech GmbH" },
]
dependencies = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-with-pdf>=0.9",
    "click<8.3"
]

[project.optional-dependencies]
dev = [
    "build",
]

[project.scripts]
valutech-docs-init = "valutech_docs_template.cli:main"

[project.entry-points."mkdocs.plugins"]
valutech-comments = "valutech_docs_template.plugins.comments:CommentsPlugin"

[tool.setuptools.packages.find]
include = ["valutech_docs_template*"]

[tool.setuptools.package-data]
"valutech_docs_template" = [
    "mkdocs-base.yml",
    "overrides/**/*",
    "web/**/*",
    "api/**/*",
    "api/**/.*",
]
