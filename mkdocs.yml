# ============================================================
# MkDocs Configuration — ValuTech Template (standalone dev)
# ============================================================
#
# This is the standalone config for developing the template itself.
# It inherits from the base config inside the package and adds
# settings specific to this repo (logo, nav, etc.).
#
# SETUP:
#   pip install -e .
#   mkdocs serve
#
# ============================================================

INHERIT: valutech_docs_template/mkdocs-base.yml

site_name: "Project Documentation"

# --------------- Theme overrides ---------------
theme:
  logo: assets/images/logo.png
  favicon: assets/images/favicon.png

# --------------- Custom CSS ---------------
extra_css:
  - stylesheets/extra.css

# --------------- Plugin overrides ---------------
# Override custom_template_path for local dev (relative path works here).
plugins:
  with-pdf:
    custom_template_path: valutech_docs_template/overrides/pdf

# --------------- Navigation ---------------
nav:
  - Home: index.md
  - Getting Started: getting-started/getting-started.md
  - Architecture: architecture/architecture.md
  - API Reference: api-reference/api-reference.md
  - Guides: guides/guides.md
