# ============================================================
# MkDocs Configuration — ValuTech Documentation Template
# ============================================================
#
# SETUP:
#   pip install mkdocs mkdocs-material mkdocs-with-pdf
#
# BUILD:
#   mkdocs build                            # HTML only
#   ENABLE_PDF_EXPORT=1 mkdocs build        # HTML + PDF
#   mkdocs serve                            # Local dev server
#
# ============================================================

site_name: "Project Documentation"
site_author: "ValuTech GmbH"
site_description: "Technical documentation powered by the ValuTech docs-as-code template"

# --------------- Theme ---------------
theme:
  name: material
  logo: assets/images/logo.png
  favicon: assets/images/favicon.png
  icon:
    repo: fontawesome/brands/git-alt
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

# --------------- Custom CSS ---------------
extra_css:
  - stylesheets/extra.css

# --------------- Markdown Extensions ---------------
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

# --------------- Plugins ---------------
plugins:
  - search

  # PDF Export — requires WeasyPrint + GTK3/Pango native libs.
  # Activated via ENABLE_PDF_EXPORT=1 environment variable.
  - with-pdf:
      author: "ValuTech GmbH"
      copyright: "ValuTech GmbH. All rights reserved."
      cover: true
      cover_title: "Project Documentation"
      cover_subtitle: "Technical Documentation"
      custom_template_path: overrides/pdf
      toc_level: 3
      enabled_if_env: ENABLE_PDF_EXPORT

# --------------- Navigation ---------------
nav:
  - Home: index.md
  - Getting Started: getting-started/getting-started.md
  - Architecture: architecture/architecture.md
  - API Reference: api-reference/api-reference.md
  - Guides: guides/guides.md
